<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PANEL DE DESEMPEÑO - EQUIPO DE VENTAS</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- SheetJS para lectura/escritura de Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
  </style>
</head>
<body class="bg-[#f3f5f8] min-h-screen text-slate-800 font-sans pb-12">

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="max-w-7xl mx-auto px-4 md:px-8 py-6 space-y-6">

    <!-- SECCIÓN SUPERIOR: TÍTULO Y BOTONES DE ACCIÓN -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-xl md:text-2xl font-black text-slate-900 tracking-tight uppercase">
          PANEL DE DESEMPEÑO - EQUIPO DE VENTAS
        </h1>
      </div>

      <div class="flex items-center gap-3 flex-wrap">
        <!-- BOTÓN IMPORTAR EXCEL -->
        <label class="bg-white hover:bg-slate-50 text-slate-800 font-bold text-xs px-4 py-2.5 rounded-xl border border-slate-300 shadow-sm cursor-pointer transition-all flex items-center gap-2">
          <i data-lucide="upload" class="w-4 h-4 text-slate-600"></i>
          <span>Cargar Excel</span>
          <input type="file" id="inputExcel" accept=".xlsx, .xls, .csv" class="hidden" onchange="procesarExcel(event)">
        </label>

        <!-- BOTÓN TOGGLE FILTROS -->
        <button onclick="togglePanelFiltros()" class="bg-white hover:bg-slate-50 text-slate-800 font-bold text-xs px-4 py-2.5 rounded-xl border border-slate-300 shadow-sm transition-all flex items-center gap-2">
          <i data-lucide="sliders-horizontal" class="w-4 h-4 text-slate-600"></i>
          <span>Filtros</span>
        </button>

        <!-- BOTÓN EXPORTAR -->
        <button onclick="exportarExcel()" class="bg-[#0f172a] hover:bg-slate-800 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-md transition-all flex items-center gap-2">
          <span>Exportar</span>
        </button>
      </div>
    </div>

    <!-- PANEL DESPLEGABLE DE FILTROS -->
    <div id="panelFiltros" class="hidden bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <span class="font-bold text-xs uppercase tracking-wider text-slate-700">Opciones de Filtrado Avanzado</span>
        <button onclick="limpiarFiltros()" class="text-xs text-blue-600 hover:underline font-bold">Limpiar todo</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs">
        <div>
          <label class="font-bold text-slate-600 block mb-1">Supervisor:</label>
          <select id="selectSupervisor" onchange="aplicarFiltrosGlobales()" class="w-full bg-slate-50 border border-slate-300 text-slate-800 font-semibold rounded-xl p-2 focus:outline-none focus:border-slate-500">
            <option value="todos">Todos los Supervisores</option>
          </select>
        </div>

        <div>
          <label class="font-bold text-slate-600 block mb-1">Fecha Desde:</label>
          <input type="date" id="filterFechaDesde" onchange="aplicarFiltrosGlobales()" class="w-full bg-slate-50 border border-slate-300 text-slate-800 font-semibold rounded-xl p-2 focus:outline-none focus:border-slate-500">
        </div>

        <div>
          <label class="font-bold text-slate-600 block mb-1">Fecha Hasta:</label>
          <input type="date" id="filterFechaHasta" onchange="aplicarFiltrosGlobales()" class="w-full bg-slate-50 border border-slate-300 text-slate-800 font-semibold rounded-xl p-2 focus:outline-none focus:border-slate-500">
        </div>

        <div>
          <label class="font-bold text-slate-600 block mb-1">Buscar Asesor:</label>
          <input type="text" id="searchInput" onkeyup="aplicarFiltrosGlobales()" placeholder="Nombre o @usuario..." class="w-full bg-slate-50 border border-slate-300 text-slate-800 font-semibold rounded-xl p-2 focus:outline-none focus:border-slate-500">
        </div>
      </div>
    </div>

    <!-- TARJETAS DE INDICADORES GLOBALES (KPIs) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
      
      <!-- KPI 1: TOTAL DE ASESORES -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-slate-500 block mb-1">Total de Asesores</span>
          <div id="kpiTotalAsesores" class="text-2xl font-black text-slate-900">0</div>
        </div>
        <div class="p-3 bg-slate-100 text-slate-500 rounded-2xl">
          <i data-lucide="users" class="w-5 h-5"></i>
        </div>
      </div>

      <!-- KPI 2: TOTAL DE META ACOGIDA -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-slate-500 block mb-1">Total de Meta Acogida</span>
          <div id="kpiMetaTotal" class="text-2xl font-black text-slate-900">0</div>
        </div>
        <div class="p-3 bg-slate-100 text-slate-500 rounded-2xl">
          <i data-lucide="target" class="w-5 h-5"></i>
        </div>
      </div>

      <!-- KPI 3: LLAMADAS REALIZADAS TOTAL -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-slate-500 block mb-1">Llamadas Realizadas Total</span>
          <div id="kpiLlamadasTotal" class="text-2xl font-black text-slate-900">0</div>
        </div>
        <div class="p-3 bg-slate-100 text-slate-500 rounded-2xl">
          <i data-lucide="phone" class="w-5 h-5"></i>
        </div>
      </div>

      <!-- KPI 4: EFECTIVIDAD TOTAL -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-slate-500 block mb-1">Efectividad Total</span>
          <div id="kpiEfectividadGlobal" class="text-2xl font-black text-slate-900">0.0%</div>
        </div>
        <div class="p-3 bg-slate-100 text-slate-500 rounded-2xl">
          <i data-lucide="trending-up" class="w-5 h-5"></i>
        </div>
      </div>

    </div>

    <!-- TABLA PRINCIPAL ESTILO IMAGEN REFERENCIAL -->
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead class="bg-[#1e293b] text-white font-bold tracking-wider uppercase">
            <tr>
              <th class="p-4 pl-6 border-r border-slate-700/60 w-1/3">ASESOR</th>
              <th class="p-4 border-r border-slate-700/60">
                <div class="flex items-center justify-between">
                  <span>SUPERVISOR</span>
                  <i data-lucide="filter" class="w-3.5 h-3.5 text-slate-400"></i>
                </div>
              </th>
              <th class="p-4 border-r border-slate-700/60 text-center w-28">META ACO</th>
              <th class="p-4 border-r border-slate-700/60 text-center w-28">AVANCE</th>
              <th class="p-4 border-r border-slate-700/60 text-center w-36">% CUMP</th>
              <th class="p-4 border-r border-slate-700/60 text-center w-28">LLAMADAS</th>
              <th class="p-4 text-center w-36">EFECTIVIDAD</th>
            </tr>
          </thead>
          <tbody id="tablaCuerpo" class="divide-y divide-slate-100 font-medium text-slate-800">
            <!-- Filas dinámicas -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let operacionesAcumuladas = {};
    let ejecutivosMap = {};
    let supervisoresDisponibles = new Set();
    let supervisorSeleccionado = "Eguilas Morales Gustavo ernesto";

    let ejecutivosBase = [
      { usuario: "gguerreroe", nombre: "Gipsi Guerrero Eyzaguirre", supervisor: "Eguilas Morales Gustavo ernesto", meta: 5, llamadas: 10 },
      { usuario: "cnoriegaf", nombre: "Carla Noriega Fonseca", supervisor: "Eguilas Morales Gustavo ernesto", meta: 5, llamadas: 8 },
      { usuario: "glopeza", nombre: "Guillermo Antonio López", supervisor: "Eguilas Morales Gustavo ernesto", meta: 5, llamadas: 5 },
      { usuario: "rtorresh", nombre: "Roberto Torres", supervisor: "Eguilas Morales Gustavo ernesto", meta: 5, llamadas: 0 },
      { usuario: "illanquim", nombre: "Isabel Veronica Llanqui Masias", supervisor: "Eguilas Morales Gustavo ernesto", meta: 5, llamadas: 0 },
      { usuario: "msolero", nombre: "Maritriny Patricia Soler Oberto", supervisor: "Eguilas Morales Gustavo ernesto", meta: 5, llamadas: 0 }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      cargarDesdeStorage();
    });

    function cargarDesdeStorage() {
      const savedOps = localStorage.getItem('entel_operaciones_acumuladas');
      const savedEjec = localStorage.getItem('entel_ejecutivos_map');

      if (savedOps) {
        try { operacionesAcumuladas = JSON.parse(savedOps); } catch(e) { operacionesAcumuladas = {}; }
      }
      
      ejecutivosMap = {};
      supervisoresDisponibles.clear();

      ejecutivosBase.forEach(e => {
        ejecutivosMap[e.usuario.toLowerCase()] = {
          usuario: e.usuario,
          nombre: e.nombre,
          supervisor: e.supervisor,
          meta: e.meta,
          avance: 0,
          llamadas: e.llamadas
        };
        supervisoresDisponibles.add(e.supervisor);
      });

      if (savedEjec) {
        try {
          const parsed = JSON.parse(savedEjec);
          Object.keys(parsed).forEach(k => {
            if (k !== 'galatat') {
              if (ejecutivosMap[k]) {
                ejecutivosMap[k].meta = parsed[k].meta !== undefined ? parsed[k].meta : ejecutivosMap[k].meta;
                ejecutivosMap[k].llamadas = parsed[k].llamadas !== undefined ? parsed[k].llamadas : ejecutivosMap[k].llamadas;
              } else {
                ejecutivosMap[k] = parsed[k];
              }
              if (parsed[k].supervisor) supervisoresDisponibles.add(parsed[k].supervisor);
            }
          });
        } catch(e) {}
      }

      actualizarSelectorSupervisores();
      recalcularAvances();
    }

    function guardarEnStorage() {
      localStorage.setItem('entel_operaciones_acumuladas', JSON.stringify(operacionesAcumuladas));
      localStorage.setItem('entel_ejecutivos_map', JSON.stringify(ejecutivosMap));
    }

    function actualizarSelectorSupervisores() {
      const select = document.getElementById('selectSupervisor');
      let html = '<option value="todos">Todos los Supervisores</option>';
      
      supervisoresDisponibles.forEach(sup => {
        const selected = (sup === supervisorSeleccionado) ? 'selected' : '';
        html += `<option value="${sup}" ${selected}>${sup}</option>`;
      });

      select.innerHTML = html;
    }

    function procesarExcel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const worksheet = workbook.Sheets[workbook.SheetNames[0]];
          const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false, defval: '' });

          if (!rawRows || rawRows.length === 0) {
            alert("El archivo Excel está vacío.");
            return;
          }

          let colUser = -1, colNom = -1, colSup = -1, colTipoOp = -1, colFecha = -1, colNroOp = -1, headerRow = -1;

          for (let r = 0; r < Math.min(25, rawRows.length); r++) {
            const row = rawRows[r];
            if (!row) continue;
            for (let c = 0; c < row.length; c++) {
              const val = String(row[c] || '').toUpperCase().trim();
              if (val.includes('CODIGO USUARIO') || val === 'USUARIO WEB') colUser = c, headerRow = r;
              if (val.includes('NOMBRE USUARIO') || val === 'NOMBRE Y APELLIDOS') colNom = c;
              if (val === 'SUPERVISOR') colSup = c;
              if (val === 'TIPO OPERACION') colTipoOp = c;
              if (val.includes('FECHA REGISTRO') || val === 'FECHA') colFecha = c;
              if (val.includes('NRO.OPERACION') || val.includes('NRO OPERACION') || val === 'OPERACION') colNroOp = c;
            }
            if (colUser !== -1) break;
          }

          if (colUser === -1 || colTipoOp === -1) {
            alert("No se encontraron las columnas requeridas en el Excel.");
            return;
          }

          let nuevos = 0;

          for (let r = headerRow + 1; r < rawRows.length; r++) {
            const row = rawRows[r];
            if (!row) continue;

            const usuario = String(row[colUser] || '').trim().toLowerCase();
            if (usuario === 'galatat' || !usuario || usuario === 'undefined' || usuario === '0') continue;

            const nombre = colNom !== -1 ? String(row[colNom] || '').trim() : '';
            const supervisor = colSup !== -1 ? String(row[colSup] || '').trim() : 'Sin Supervisor';
            const tipoOperacion = String(row[colTipoOp] || '').toUpperCase().trim();
            const fechaStr = colFecha !== -1 ? String(row[colFecha] || '').trim() : '';
            const nroOp = colNroOp !== -1 ? String(row[colNroOp] || '').trim() : `AUTO_${usuario}_${fechaStr}_${r}`;

            if (!operacionesAcumuladas[nroOp]) {
              operacionesAcumuladas[nroOp] = { nroOp, usuario, nombre, supervisor, tipoOperacion, fechaStr };
              nuevos++;
            }

            if (!ejecutivosMap[usuario]) {
              ejecutivosMap[usuario] = {
                usuario,
                nombre: nombre || usuario,
                supervisor,
                meta: 5,
                avance: 0,
                llamadas: 0
              };
            } else {
              if (nombre && (!ejecutivosMap[usuario].nombre || ejecutivosMap[usuario].nombre === usuario)) {
                ejecutivosMap[usuario].nombre = nombre;
              }
              if (supervisor) ejecutivosMap[usuario].supervisor = supervisor;
            }

            if (supervisor) supervisoresDisponibles.add(supervisor);
          }

          actualizarSelectorSupervisores();
          recalcularAvances();
          guardarEnStorage();
          document.getElementById('inputExcel').value = '';

          alert(`¡Éxito! Se añadieron ${nuevos} operaciones válidas al acumulado.`);

        } catch (err) {
          console.error(err);
          alert("Error al leer el archivo Excel.");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function parseFechaExcel(fStr) {
      if (!fStr) return null;
      const partes = fStr.split(' ')[0].split(/[\/\-]/);
      if (partes.length === 3) {
        if (partes[2].length === 4) {
          return new Date(partes[2], partes[1] - 1, partes[0]);
        } else if (partes[0].length === 4) {
          return new Date(partes[0], partes[1] - 1, partes[2]);
        }
      }
      return null;
    }

    function recalcularAvances() {
      Object.keys(ejecutivosMap).forEach(k => ejecutivosMap[k].avance = 0);

      const fDesdeVal = document.getElementById('filterFechaDesde').value;
      const fHastaVal = document.getElementById('filterFechaHasta').value;

      const fDesde = fDesdeVal ? new Date(fDesdeVal + "T00:00:00") : null;
      const fHasta = fHastaVal ? new Date(fHastaVal + "T23:59:59") : null;

      Object.values(operacionesAcumuladas).forEach(reg => {
        const tipo = reg.tipoOperacion;
        const esValido = tipo.includes('NUEVA') || tipo.includes('2DA') || tipo.includes('PORTA');
        const esExcluido = tipo.includes('RENOVACION') || tipo.includes('FIBRA') || tipo.includes('MIGRACION');

        if (esValido && !esExcluido) {
          let pasaFecha = true;
          if (fDesde || fHasta) {
            const regFecha = parseFechaExcel(reg.fechaStr);
            if (regFecha) {
              if (fDesde && regFecha < fDesde) pasaFecha = false;
              if (fHasta && regFecha > fHasta) pasaFecha = false;
            }
          }

          if (pasaFecha && ejecutivosMap[reg.usuario]) {
            ejecutivosMap[reg.usuario].avance++;
          }
        }
      });

      renderizarTabla();
    }

    function aplicarFiltrosGlobales() {
      supervisorSeleccionado = document.getElementById('selectSupervisor').value;
      recalcularAvances();
    }

    function renderizarTabla() {
      const tbody = document.getElementById('tablaCuerpo');
      tbody.innerHTML = '';

      const query = document.getElementById('searchInput').value.toLowerCase();

      let sumMeta = 0, sumAvance = 0, sumLlamadas = 0;

      let arrEjecutivos = Object.values(ejecutivosMap).filter(item => {
        if (supervisorSeleccionado !== "todos" && item.supervisor !== supervisorSeleccionado) return false;
        if (item.usuario.toLowerCase() === 'galatat') return false;

        const matchQuery = item.usuario.toLowerCase().includes(query) || item.nombre.toLowerCase().includes(query);
        return matchQuery;
      });

      // ORDENAR DE MAYOR A MENOR SEGÚN VENTAS
      arrEjecutivos.sort((a, b) => b.avance - a.avance);

      arrEjecutivos.forEach((item) => {
        sumMeta += parseInt(item.meta) || 0;
        sumAvance += parseInt(item.avance) || 0;
        sumLlamadas += parseInt(item.llamadas) || 0;

        const pctCump = item.meta > 0 ? (item.avance / item.meta) * 100 : 0;
        const pctFormateado = Math.min(pctCump, 100).toFixed(1);
        const efecNum = item.llamadas > 0 ? (item.avance / item.llamadas) * 100 : 0;
        const efectividad = item.llamadas > 0 ? efecNum.toFixed(1) : '0.0';

        // BARRA DE PROGRESO DE CUMPLIMIENTO (% CUMP)
        let dotColor = "bg-rose-400";
        let barColorCump = "bg-rose-400";
        
        if (item.avance >= 4 || pctCump >= 80) {
          dotColor = "bg-emerald-400";
          barColorCump = "bg-emerald-400";
        } else if (item.avance >= 1 || pctCump >= 40) {
          dotColor = "bg-amber-400";
          barColorCump = "bg-amber-400";
        }

        // BARRA DE PROGRESO DE EFECTIVIDAD
        let barColorEfec = "bg-rose-400";
        if (efecNum >= 40) {
          barColorEfec = "bg-emerald-400";
        } else if (efecNum >= 20) {
          barColorEfec = "bg-amber-400";
        }

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition-colors";
        tr.innerHTML = `
          <!-- ASESOR -->
          <td class="p-4 pl-6 border-r border-slate-100">
            <div class="flex items-center gap-3">
              <span class="w-2.5 h-2.5 rounded-full ${dotColor} shrink-0"></span>
              <div>
                <div class="font-bold text-slate-900 text-xs">${item.nombre}</div>
                <div class="text-[11px] text-slate-400 font-mono">@${item.usuario}</div>
              </div>
            </div>
          </td>

          <!-- SUPERVISOR -->
          <td class="p-4 border-r border-slate-100">
            <div class="flex items-center gap-3">
              <span class="w-2.5 h-2.5 rounded-full ${dotColor} shrink-0"></span>
              <span class="text-xs text-slate-700">${item.supervisor}</span>
            </div>
          </td>

          <!-- META ACO -->
          <td class="p-4 border-r border-slate-100 text-center">
            <input type="number" min="0" value="${item.meta}" onchange="actualizarMeta('${item.usuario}', this.value)" class="w-16 bg-white border border-slate-300 rounded-xl text-center py-1.5 px-2 font-semibold text-slate-800 focus:outline-none focus:border-slate-500 shadow-sm">
          </td>

          <!-- AVANCE -->
          <td class="p-4 border-r border-slate-100 text-center font-bold text-slate-900 text-sm">
            ${item.avance}
          </td>

          <!-- % CUMP CON BARRA DE PROGRESO -->
          <td class="p-4 border-r border-slate-100 text-center">
            <div class="space-y-1.5 w-24 mx-auto">
              <span class="font-bold text-slate-800 block text-xs">${pctFormateado}%</span>
              <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                <div class="${barColorCump} h-1.5 rounded-full" style="width: ${Math.min(pctCump, 100)}%"></div>
              </div>
            </div>
          </td>

          <!-- LLAMADAS -->
          <td class="p-4 border-r border-slate-100 text-center">
            <input type="number" min="0" value="${item.llamadas}" onchange="actualizarLlamadas('${item.usuario}', this.value)" class="w-16 bg-white border border-slate-300 rounded-xl text-center py-1.5 px-2 font-semibold text-slate-800 focus:outline-none focus:border-slate-500 shadow-sm">
          </td>

          <!-- EFECTIVIDAD CON BARRA DE PROGRESO -->
          <td class="p-4 text-center">
            <div class="space-y-1.5 w-24 mx-auto">
              <span class="font-bold text-slate-800 block text-xs">${efectividad}%</span>
              <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                <div class="${barColorEfec} h-1.5 rounded-full" style="width: ${Math.min(efecNum, 100)}%"></div>
              </div>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // ACTUALIZAR TARJETAS KPI SUPERIORES
      document.getElementById('kpiTotalAsesores').innerText = arrEjecutivos.length;
      document.getElementById('kpiMetaTotal').innerText = sumMeta;
      document.getElementById('kpiLlamadasTotal').innerText = sumLlamadas;

      const efecGlobal = sumLlamadas > 0 ? ((sumAvance / sumLlamadas) * 100).toFixed(1) : 0.0;
      document.getElementById('kpiEfectividadGlobal').innerText = `${efecGlobal}%`;

      lucide.createIcons();
    }

    function actualizarMeta(usuario, val) {
      if (ejecutivosMap[usuario]) {
        ejecutivosMap[usuario].meta = parseInt(val) || 0;
        guardarEnStorage();
        renderizarTabla();
      }
    }

    function actualizarLlamadas(usuario, val) {
      if (ejecutivosMap[usuario]) {
        ejecutivosMap[usuario].llamadas = parseInt(val) || 0;
        guardarEnStorage();
        renderizarTabla();
      }
    }

    function togglePanelFiltros() {
      const panel = document.getElementById('panelFiltros');
      panel.classList.toggle('hidden');
    }

    function limpiarFiltros() {
      document.getElementById('selectSupervisor').value = "Eguilas Morales Gustavo ernesto";
      document.getElementById('filterFechaDesde').value = "";
      document.getElementById('filterFechaHasta').value = "";
      document.getElementById('searchInput').value = "";
      aplicarFiltrosGlobales();
    }

    function exportarExcel() {
      const filtrados = Object.values(ejecutivosMap).filter(e => (supervisorSeleccionado === "todos" || e.supervisor === supervisorSeleccionado) && e.usuario.toLowerCase() !== 'galatat');
      filtrados.sort((a, b) => b.avance - a.avance);

      const dataExport = filtrados.map(item => ({
        "ASESOR": item.nombre,
        "USUARIO": item.usuario,
        "SUPERVISOR": item.supervisor,
        "META ACO": item.meta,
        "AVANCE": item.avance,
        "% CUMP": item.meta > 0 ? ((item.avance / item.meta) * 100).toFixed(1) + '%' : '0%',
        "LLAMADAS": item.llamadas,
        "EFECTIVIDAD": item.llamadas > 0 ? ((item.avance / item.llamadas) * 100).toFixed(1) + '%' : '0%'
      }));

      const ws = XLSX.utils.json_to_sheet(dataExport);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Panel_Desempeno");
      XLSX.writeFile(wb, `Panel_Desempeno_Ventas_${new Date().toISOString().slice(0,10)}.xlsx`);
    }
  </script>
</body>
